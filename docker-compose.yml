services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seriesly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/seriesly
      DOCKER: "1"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask --app run init-db && python run.py"
